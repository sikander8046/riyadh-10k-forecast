# Config for the synthetic demo export (make sample). Same schema as config.yaml.

athlete:
  hr_max: 201          # bpm, used for heart-rate reserve and TRIMP
  hr_rest: 54          # bpm
  trimp_sex: male      # Banister TRIMP weighting: male (0.64, 1.92) or female (0.86, 1.67)

# Strava exports timestamps in UTC. Local dates matter for daily load, so map
# date ranges to timezones. The latest entry whose `from` is on/before the
# activity date wins.
timezones:
  - from: 2000-01-01
    tz: Asia/Karachi
  - from: 2023-08-01
    tz: Asia/Riyadh

privacy:
  trim_start_end_m: 500     # GPS removed for the first/last N metres of every activity
  keep_coordinates: true    # set false to drop lat/lon entirely

paths:
  export_dir: data/raw/sample_export
  interim_dir: data/interim/sample
  warehouse: data/warehouse/sample.duckdb

quality:
  max_run_speed_mps: 8.0    # faster than 2:05/km is treated as a GPS spike
  hr_min_valid: 35
  hr_max_margin: 10         # HR above hr_max + margin is treated as sensor noise
  pause_gap_s: 10           # gaps longer than this are excluded from moving time
